<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>요리 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e6;--fg:#2b1b17;--card:#fff8e7;--btn:#e5733a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1714;--fg:#f0ebe3;--card:#33291f}}
:root[data-theme="dark"]{--bg:#1a1714;--fg:#f0ebe3;--card:#33291f}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}
canvas,img{image-rendering:pixelated}
#app{display:none;flex-direction:column;align-items:center;max-width:420px;margin:0 auto;padding:8px 10px;gap:8px}
#hud{display:flex;justify-content:space-between;width:100%;box-sizing:border-box;padding:6px 10px;background:var(--card);border:4px solid #2b1b17;font-size:15px;color:var(--fg)}
#c{width:100%;border:4px solid #2b1b17;box-sizing:border-box}
#nx{width:100%;font-size:13px;line-height:1.6;text-align:center;min-height:40px}
#nx img{width:20px;margin:0 1px;vertical-align:middle}
.pb{border:4px solid #2b1b17;border-radius:0;background:var(--btn);color:#fff;font-weight:800;font-size:18px;padding:14px 22px;box-shadow:0 5px 0 #2b1b17;font-family:inherit}
.pb:active{transform:translateY(4px);box-shadow:0 1px 0 #2b1b17}
.pb:disabled{opacity:.45}
#buy{width:100%}
#tip{font-size:12px;opacity:.85;text-align:center;line-height:1.9}
#tip img{width:18px;vertical-align:middle}
#lobby{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:conic-gradient(#e9d8b4 25%,#dfcba2 0 50%,#e9d8b4 0 75%,#dfcba2 0) 0 0/48px 48px;color:#2b1b17;text-align:center;z-index:5}
#lobby h1{margin:0;font-size:44px;color:#ffd34d;text-shadow:-3px 0 #2b1b17,3px 0 #2b1b17,0 -3px #2b1b17,0 3px #2b1b17,3px 3px 0 #2b1b17,-3px -3px 0 #2b1b17,3px -3px 0 #2b1b17,-3px 3px 0 #2b1b17,0 7px 0 #2b1b17}
#chef{animation:hop 1s steps(2) infinite}
@keyframes hop{50%{transform:translateY(-10px)}}
#row img{width:36px;margin:0 3px}
#over{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:12px;z-index:6}
#panel{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(26,23,20,.94);color:#fff;z-index:7;text-align:center;padding:16px;overflow:auto;touch-action:pan-y}
#panel h2{margin:0;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px}
.cd{background:var(--card);color:var(--fg);border:4px solid #2b1b17;padding:6px 4px;font-size:12px;min-width:64px}
.cd img{width:44px}
.cd.on{border-color:#f5c32c;background:#5a4a1f;color:#fff}
.cd.no{opacity:.4}
#coin{font-size:20px;color:#8a5a00;font-weight:800}
html,body{touch-action:manipulation;overflow-y:auto}
canvas{touch-action:none}
#tip{display:none}
#info{width:100%;box-sizing:border-box;min-height:70px;padding:8px 10px;background:var(--card);border:4px solid #2b1b17;font-size:13px;line-height:1.55;color:var(--fg)}
#info img{width:36px;float:left;margin-right:10px}
#opt{display:flex;gap:8px;width:100%}
#opt button{flex:1;padding:8px;font-size:13px;font-weight:800;border:3px solid #2b1b17;background:var(--card);color:var(--fg);font-family:inherit}
html,body{background:#7a5232 repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.14) 30px 32px)}
#app{gap:10px;padding:10px 12px 24px}
#hud{gap:8px;background:none;border:0;padding:0}
.chip{flex:1;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#3a2515;border:4px solid #2b1b17;box-shadow:inset 0 0 0 2px #8b5a2b;color:#fff8e7;font-size:14px;white-space:nowrap}
.chip i{width:24px;height:24px;flex:none;background-size:contain;image-rendering:pixelated}
#c{border:4px solid #2b1b17;box-shadow:0 0 0 4px #c9955a,0 0 0 8px #2b1b17;margin:8px 0}
#info{background:#fff8e7;color:#2b1b17;border:4px solid #2b1b17;box-shadow:inset 0 0 0 3px #e3d4b0;min-height:76px}
#nx{background:#2f4a3a;color:#f3ecd8;border:4px solid #2b1b17;box-shadow:inset 0 0 0 3px #8b5a2b;padding:6px 8px;box-sizing:border-box}
#nx img{width:24px}
#opt button{background:#c9955a;color:#2b1b17;border:4px solid #2b1b17;box-shadow:0 4px 0 #2b1b17,inset 0 0 0 2px #e0b179}
#opt button:active{transform:translateY(3px);box-shadow:0 1px 0 #2b1b17}
#buy{background:#e5733a;box-shadow:0 5px 0 #2b1b17,inset 0 0 0 3px #f5a06a;letter-spacing:1px}
#nx{display:none}
#row img{width:30px}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);max-width:86%;padding:10px 18px;background:rgba(30,30,30,.92);color:#fff;border-radius:14px;text-align:center;font-size:14px;line-height:1.5;opacity:0;transition:opacity .3s;pointer-events:none;z-index:4;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#panel{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-overflow-scrolling:touch}
#panel>:first-child{margin-top:auto}
#panel>:last-child{margin-bottom:auto}
#nick{font-weight:800;font-size:18px;color:#2b1b17}
#panel #nin{width:200px;padding:10px;font-size:18px;font-family:inherit;border:4px solid #2b1b17;background:#fff8e7;color:#2b1b17;text-align:center;-webkit-user-select:text;user-select:text}
#panel .sets{width:92%;max-width:360px;background:#fff8e7;color:#2b1b17;border:4px solid #2b1b17;box-shadow:inset 0 0 0 3px #e3d4b0;padding:6px 14px 10px;text-align:left;box-sizing:border-box}
.sec{margin:12px 0 2px;padding:2px 8px;background:#2b1b17;color:#ffd34d;font-weight:800;font-size:13px;display:inline-block}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:2px dashed #d9c9a3;font-size:14px}
.set-row small{opacity:.65;font-size:11px;font-weight:600}
.sw{width:52px;height:26px;background:#9a8f7a;border:3px solid #2b1b17;position:relative;flex:none;box-sizing:content-box;height:20px;width:46px}
.sw i{position:absolute;top:1px;left:1px;width:14px;height:14px;background:#fff8e7;border:2px solid #2b1b17;transition:left .12s steps(3)}
.sw.on{background:#4cae4c}
.sw.on i{left:27px}
.set-row input[type=range]{width:130px;accent-color:#e5733a}
.seg{display:flex}
.seg button{padding:6px 14px;font-size:14px;font-weight:800;font-family:inherit;border:3px solid #2b1b17;background:#e3d4b0;color:#2b1b17;margin-left:-3px}
.seg button.on{background:#e5733a;color:#fff}
.set-btns{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 2px}
.set-btns .pb{padding:8px 12px;font-size:14px;box-shadow:0 4px 0 #2b1b17}
#lobby{background:#7a5232 repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.14) 30px 32px);justify-content:flex-start;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 18px);gap:0;overflow-y:auto;box-sizing:border-box}
#lwrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px;margin:auto 0}
#ltitle{background:#c9955a;color:#fff8e7;border:4px solid #2b1b17;box-shadow:inset 0 0 0 3px #e0b179,0 5px 0 #2b1b17;padding:6px 26px 8px;font-size:34px;font-weight:900;letter-spacing:2px;text-shadow:-2px 0 #2b1b17,2px 0 #2b1b17,0 -2px #2b1b17,0 2px #2b1b17,2px 2px 0 #2b1b17;line-height:1.1}
#ltitle small{display:block;font-size:12px;letter-spacing:1px;text-shadow:none;color:#2b1b17;margin-top:2px}
#lscene{width:100%;border:4px solid #2b1b17;box-shadow:0 0 0 4px #c9955a,0 0 0 8px #2b1b17;margin:8px 0;box-sizing:border-box}
#lscene canvas{width:100%;display:block}
#lstat{display:flex;gap:8px;width:100%}
#lstat .chip{justify-content:center;font-size:13px;min-width:0;padding:6px 4px}
#go{width:100%;font-size:26px;padding:16px;background:#e5733a;letter-spacing:3px;box-shadow:0 6px 0 #2b1b17,inset 0 0 0 3px #f5a06a}
#lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:4px}
.lb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;font-size:14px;font-weight:800;border:4px solid #2b1b17;color:#fff;font-family:inherit;box-shadow:0 5px 0 #2b1b17,inset 0 0 0 2px rgba(255,255,255,.25);border-radius:0}
.lb i{width:36px;height:36px;background-size:contain;image-rendering:pixelated;background-repeat:no-repeat}
.lb:active{transform:translateY(4px);box-shadow:0 1px 0 #2b1b17}
#sb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:52px;height:52px;padding:6px;background:#6a7a8a;align-items:center;justify-content:center}
#lstat #nick{color:#fff8e7;font-size:13px;font-weight:800}
#lstat .chip span{overflow:hidden;text-overflow:ellipsis}
html{--f:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Noto Sans CJK KR',sans-serif}
html,body,button,input,select,textarea{font-family:var(--f)}
button{line-height:1.25}
.jua *{font-weight:400!important;font-synthesis:none}
.jua body{font-weight:400}
#panel{background:#2a1d14 repeating-linear-gradient(90deg,transparent 0 30px,rgba(255,255,255,.04) 30px 32px)}
#lstat{flex-wrap:wrap}
#lstat .chip{flex:1 1 40%}
#lstat .chip:first-child{flex:1 1 100%}
#lstat .chip span{overflow:visible}
.set-row b{white-space:nowrap}
.set-row input[type=range]{width:104px}
#over{background:rgba(20,14,10,.88);padding:20px;text-align:center;box-sizing:border-box}
#over h1{margin:0;font-size:36px;color:#ffd34d;text-shadow:-2px 0 #2b1b17,2px 0 #2b1b17,0 -2px #2b1b17,0 2px #2b1b17,2px 2px 0 #2b1b17}
#os{max-width:300px;line-height:1.8;font-size:16px;background:#fff8e7;color:#2b1b17;border:4px solid #2b1b17;box-shadow:inset 0 0 0 3px #e3d4b0;padding:12px 18px}
@media (max-width:350px){
  .chip{font-size:11px;padding:5px 4px;gap:3px;min-width:0}
  .chip i{width:16px;height:16px}
  #hud{gap:4px}
  .set-row input[type=range]{width:54px}
  .set-row{gap:6px;font-size:13px}
  #ltitle{font-size:28px;padding:6px 16px 8px}
  .lb{font-size:12px}
  #go{font-size:22px}
}

.book{width:94%;max-width:380px;background:#fff8e7;color:#2b1b17;border:4px solid #2b1b17;box-shadow:inset 0 0 0 3px #e3d4b0,0 0 0 4px #8b5a2b;padding:10px;text-align:left;box-sizing:border-box}
.btabs{display:flex;gap:4px;margin:-10px -10px 10px;background:#8b5a2b;padding:8px 8px 0;border-bottom:4px solid #2b1b17}
.btab{flex:1;padding:7px 2px 6px;font-size:14px;border:3px solid #2b1b17;border-bottom:0;background:#c9955a;color:#fff8e7;font-family:inherit;border-radius:0;margin-bottom:-4px}
.btab.on{background:#fff8e7;color:#2b1b17;padding-bottom:9px}
.bprog{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
.bprog .mi{width:36px;height:36px;flex:none}
.bar{flex:1;height:14px;background:#e3d4b0;border:3px solid #2b1b17;position:relative;box-sizing:border-box;min-width:40px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#4cae4c}
.bar.sm{height:10px;margin:4px 0 2px}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bc{background:#fff;border:3px solid #2b1b17;padding:4px 2px 4px;text-align:center;font-size:11px;font-family:inherit;color:#2b1b17;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-height:68px;min-width:0}
.bc img{max-height:48px}
.bc span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc.sel{box-shadow:0 0 0 3px #e5733a;background:#fff3e0}
.bc.un img{filter:brightness(0);opacity:.55}
.bdet{margin-top:10px;border:3px solid #2b1b17;background:#fff;padding:10px;font-size:13px;line-height:1.6}
.bdet .top{display:flex;gap:10px;align-items:flex-start}
.bdet .bigic{flex:none;min-width:84px;min-height:84px;background:#e3d4b0;border:3px solid #2b1b17;display:flex;align-items:center;justify-content:center;padding:4px;box-sizing:border-box}
.bdet .bigic.un img{filter:brightness(0);opacity:.5}
.bdet h3{margin:0 0 2px;font-size:17px}
.bdet .fl{font-size:12px;opacity:.85;margin:4px 0}
.sc{display:inline-block;background:#2b1b17;color:#ffd34d;padding:1px 7px;margin:2px 3px 2px 0;font-size:11px}
.bdet .pk{margin-top:8px;border-top:2px dashed #d9c9a3;padding-top:6px;font-size:12px}
.ac{display:flex;gap:10px;align-items:center;border:3px solid #2b1b17;background:#fff;padding:8px;margin-bottom:8px;position:relative}
.ac.done{background:#fff3c4}
.ac .aico{width:36px;height:36px;flex:none}
.ac .aico.lock{filter:grayscale(1) brightness(.6);opacity:.7}
.ac .atx{flex:1;min-width:0}
.ac .atx small{font-size:11px;opacity:.85}
.ac .rib{position:absolute;top:-3px;right:0;background:#4cae4c;color:#fff;font-size:11px;padding:0 7px;border:3px solid #2b1b17}
.rw{display:inline-flex;align-items:center;gap:4px;background:#2b1b17;color:#ffd34d;padding:0 7px;font-size:11px;margin-left:4px}
.rw img{width:14px;height:14px}
</style>
</head>
<body>
<div id="lobby">
  <button class="lb" id="sb"><i></i></button>
  <div id="lwrap">
    <div id="ltitle">요리 디펜스<small>픽셀 주방의 수호자</small></div>
    <div id="lscene"><canvas id="lcv" width="360" height="170"></canvas></div>
    <div id="lstat"><div class="chip"><span id="nick"></span></div><div class="chip"><i id="lc"></i><span id="coin"></span></div><div class="chip"><i id="lw"></i><span id="bestl"></span></div></div>
    <button class="pb" id="go">영업 시작!</button>
    <div id="lgrid">
      <button class="lb" id="gb" style="background:#9b59b6"><i></i>뽑기</button>
      <button class="lb" id="db" style="background:#2f9e44"><i></i>덱 편성</button>
      <button class="lb" id="ub" style="background:#d9822b"><i></i>강화</button>
      <button class="lb" id="xb" style="background:#3e8bff"><i></i>도감</button>
      <button class="lb" id="ab" style="background:#b5485d"><i></i>업적</button>
      <button class="lb" id="rb" style="background:#8a5a2b"><i></i>레시피</button>
    </div>
  </div>
</div>

<div id="app">
  <div id="hud"><div class="chip"><i id="iw"></i><span id="w">웨이브 1</span></div><div class="chip"><i id="il"></i><span id="l">평점 10</span></div><div class="chip"><i id="is"></i><span id="s">팁 40</span></div></div>
  <canvas id="c" width="360" height="300"></canvas>
  <div id="info"></div>
  <div id="opt"><button id="o1">배속 x1</button><button id="o3">합성</button><button id="o2">설정</button></div>
  <div id="nx"></div>
  <button class="pb" id="buy">재료 뽑기</button>
  <div id="tip"></div>
</div>
<div id="toast"></div>
<div id="panel"></div>
<div id="over"><h1>영업 종료</h1><div id="os"></div><button class="pb" id="re">다시 하기</button><button class="pb" id="lb" style="background:#6a7a8a">로비로</button></div>

 ()=>'<b>합치기</b><br>같은 재료 · 같은 ★을 끌어서 겹치면<br>랜덤 재료의 ★+1이 돼요 (최대 ★6)<br>'+ic(ING[0])+' + '+ic(ING[0])+' → '+ic(ING[4])+'<br><small>반죽 '+ic(ING[8])+'은 같은 ★의 아무 재료로 변신해요</small>',
 ()=>'<b>재료를 눌러 보세요</b><br>공격력, 공격속도, 능력을 볼 수 있어요.<br>불, 독, 슬로우 같은 효과도 있어요.<br><small>5웨이브마다 보스 손님이 나와요</small>',
 ()=>'<b>로비 기능</b><br><b>뽑기</b>: 새 재료와 조각<br><b>덱 편성</b>: 5개 고르기 · <b>강화</b>: 조각으로 +15까지<br><b>도감 · 업적 · 레시피 북</b>도 있어요<br><small>게임에서 남긴 팁이 골드가 돼요</small>'
];
function tutView(pg){
  pg=pg||0;
  if(!SV.tutSeen){SV.tutSeen=1;save()}
  const last=pg>=TUT.length-1;
  panel('<h2>튜토리얼 ('+(pg+1)+'/'+TUT.length+')</h2><div style="max-width:320px;line-height:1.8;font-size:15px">'+TUT[pg]()+'</div><div style="display:flex;gap:10px">'+(pg>0?'<button class="pb" id="tp" style="background:#6a7a8a;padding:8px 18px;font-size:16px">이전</button>':'')+'<button class="pb" id="tn" style="'+(last?'background:#2f9e44;':'')+'padding:8px 18px;font-size:16px">'+(last?'시작하기':'다음')+'</button></div>');
  if($('tp'))$('tp').onclick=()=>tutView(pg-1);
  $('tn').onclick=()=>{if(!last)tutView(pg+1);else{$('panel').style.display='none';coinTxt()}};
}
function nickView(first){
  panel('<h2>'+(first?'환영합니다!':'닉네임 변경')+'</h2><div>사용할 닉네임을 정해 주세요 (최대 8자)</div><input id="nin" maxlength="8" placeholder="요리사" value="'+(SV.name||'').replace(/[<>"&]/g,'')+'"><button class="pb" id="nok" style="background:#2f9e44">확인</button>');
  $('nok').onclick=()=>{
    const v=($('nin').value||'').replace(/[<>"&]/g,'').trim().slice(0,8)||'요리사';
    SV.name=v;save();$('panel').style.display='none';coinTxt();
    if(first&&!SV.tutSeen)tutIntro();
  };
}
function startTutorial(){
  $('panel').style.display='none';$('lobby').style.display='none';$('app').style.display='flex';
  reset();
  S.tm=1;S.sp=999;S.lives=99;S.wt=1e9;S.tstep=0;S.tfix=[0,0,4];S.tt=0;
}
function endTutorial(){if(S)S.tm=0;lobby()}
function tutIntro(){
  if(!SV.tutSeen){SV.tutSeen=1;save()}
  panel('<h2>튜토리얼</h2><div style="max-width:300px;line-height:1.7">직접 해 보면서 배워 볼까요?<br>1분이면 끝나요 (처음 마치면 골드 +50)</div><button class="pb" id="tgo" style="background:#2f9e44;padding:10px 18px;font-size:16px">직접 해보기</button>');
  $('tgo').onclick=startTutorial;
}
function tm(a,b){if(!S.ban||(S.ban.tut&&S.ban.txt!==a))S.ban={txt:a,sub:b,t:99,tut:1}}
function tmTick(dt){
  S.wt=1e9;
  const free=()=>S.dice.map((d,i)=>d?-1:i).filter(i=>i>=0);
  if(S.tstep===0){
    S.tguide=null;tm('STEP 1/6 재료 뽑기','아래 [재료 뽑기] 버튼을 2번 눌러 보세요');
    if(S.buys>=2)S.tstep=1;
  }else if(S.tstep===1){
    const ix=S.dice.map((d,i)=>d&&d.t===0&&d.p===1?i:-1).filter(i=>i>=0);
    S.tguide=ix.length>=2?ix.slice(0,2):null;
    tm('STEP 2/6 합치기','같은 재료 · 같은 ★을 끌어서 겹쳐 보세요 (깜빡이는 칸)');
    if(S.mergedOnce){S.tstep=2;S.tguide=null}
  }else if(S.tstep===2){
    tm('STEP 3/6 정보 보기','재료를 한 번 눌러 공격력과 능력을 확인해 보세요');
    if(sel!==null&&S.dice[sel])S.tstep=3;
  }else if(S.tstep===3){
    if(!S.tsp){S.tsp=1;for(let i=0;i<3;i++)S.en.push({p:-i*45,hp:60,mhp:60,sp:25,k:'rush',ci:0,boss:false,st:0,pt:0,pd:0})}
    tm('STEP 4/6 손님 막기','손님이 와요! 재료가 알아서 공격해요. 모두 쓰러뜨려 보세요');
    if(S.tsp&&!S.en.length)S.tstep=4;
  }else if(S.tstep===4){
    if(!S.tj){const f=free();if(f.length>=2){S.dice[f[0]]={t:8,p:1,cd:0,pop:.4};S.dice[f[1]]={t:2,p:1,cd:0,pop:.4};S.tj=[f[0],f[1]]}}
    S.tguide=S.tj||null;
    tm('STEP 5/6 반죽 사용','반죽을 끌어 치즈 위에 겹쳐 보세요. 반죽이 치즈로 변신해요');
    if(S.tj&&!S.dice.some(d=>d&&d.t===8)){S.tstep=5;S.tguide=null;S.tt=0}
  }else if(S.tstep===5){
    S.tt+=dt;
    if(!S.tdone){S.tdone=1;if(!SV.tutDone){SV.coin+=50;SV.tutDone=1}SV.tutSeen=1;save();sfx('ach')}
    tm('STEP 6/6 완료!','튜토리얼을 마쳤어요 (처음 마치면 골드 +50)');
    if(S.tt>3.5)endTutorial();
  }
}
function hint(a,b){if(!S.ban||(S.ban.tut&&S.ban.txt!==a))S.ban={txt:a,sub:b,t:99,tut:1}}
function tutTick(dt){
  if(S&&S.tm){tmTick(dt);return}
  if(SV.tutDone||!S||S.over)return;
  if(S.tut===undefined)S.tut=0;
  if(S.tut===0){hint('1/3 재료 뽑기','아래 \'재료 뽑기\' 버튼을 눌러 재료를 놓아 보세요');if(S.buys>=2)S.tut=1}
  else if(S.tut===1){hint('2/3 합치기','같은 재료 · 같은 ★을 끌어서 겹쳐 보세요');if(S.mergedOnce){S.tut=2;S.tutT=0}}
  else if(S.tut===2){S.tutT+=dt;hint('3/3 손님 막기','손님이 출구에 닿으면 평점이 줄어요. 재료를 눌러 정보를 볼 수 있어요');if(S.tutT>7){SV.tutDone=1;save();if(S.ban&&S.ban.tut)S.ban=null;S.tut=3}}
}
function coinTxt(){$('coin').textContent='골드 '+SV.coin;$('nick').textContent=(SV.name||'요리사')+' 셰프님'}
function panel(h){
  $('panel').innerHTML=h+'<button class="pb" id="pc" style="background:#6a7a8a">닫기</button>';
  const was=$('panel').style.display==='flex'?$('panel').scrollTop:0;
  $('panel').style.display='flex';
  $('panel').scrollTop=was;
  $('pc').onclick=()=>{$('panel').style.display='none';$('panel').scrollTop=0;coinTxt()};
}
function pull(n){
  const c=n===10?450:50;
  if(SV.coin<c){gachaView([],'골드가 부족해요');return}
  SV.coin-=c;
  const W=[30,30,30,30,8,8,3,3,1,8,8,30,30,2,1,1,1],tot=W.reduce((a,b)=>a+b),res=[];
  for(let i=0;i<n;i++){let r=Math.random()*tot,k=0;while(r>=W[k]){r-=W[k];k++}const t=IL[k],nw=!SV.own[t];SV.own[t]=(SV.own[t]||0)+1;SV.pc[t]=(SV.pc[t]||0)+3;res.push([t,nw])}
  save();sfx('gacha');if(res.some(([t])=>RA[t]===3))setTimeout(()=>sfx('ach'),550);gachaView(res);
}
function gachaView(res,msg){
  panel('<h2>뽑기</h2><div>골드 '+SV.coin+(msg?' · '+msg:'')+'</div><div class="grid">'+res.map(([t,nw])=>'<div class="cd"'+(RA[t]===3?' style="border-color:#f5c32c;background:#fff3c4"':'')+'>'+ic(ING[t])+'<br>'+NM[t]+'<br>'+rb(t)+(nw?'<br><b>NEW!</b>':'')+'<br>조각 +3'+'</div>').join('')+'</div><div style="display:flex;gap:10px"><button class="pb" id="p1">1회 (50)</button><button class="pb" id="p10">10회 (450)</button></div><small>뽑으면 그 재료의 조각 3개를 얻고, 조각은 강화에 쓰여요 · 같은 재료를 또 뽑으면 숙련도도 올라요</small>');
  $('p1').onclick=()=>pull(1);$('p10').onclick=()=>pull(10);
}
function deckView(msg){
  let h='<h2>덱 편성</h2><div>'+(msg||'5개를 골라 장착하세요')+'</div><div class="grid">';
  for(const t of IL){
    const o=SV.own[t]||0,on=SV.deck.includes(t);
    h+='<div class="cd'+(on?' on':'')+(o?'':' no')+'" data-t="'+t+'">'+ic(ING[t])+'<br>'+NM[t]+(SV.up[t]?' <b>+'+SV.up[t]+'</b>':'')+'<br>'+rb(t)+'<br><small>'+(o?('숙련 Lv'+mast(t)+'<br>'+DS[t]+'<br>'+st(t).replace(' · ','<br>')):'미보유<br>'+st(t).replace(' · ','<br>'))+'</small>'+(on?'<br><b>장착</b>':'')+'</div>';
  }
  h+='</div><div>장착 '+SV.deck.length+'/5</div>';
  panel(h);
  document.querySelectorAll('.cd[data-t]').forEach(el=>el.onclick=()=>{
    const t=+el.dataset.t;if(!SV.own[t])return;
    const i=SV.deck.indexOf(t);
    if(i>=0)SV.deck.splice(i,1);
    else if(SV.deck.length<5)SV.deck.push(t);
    else{deckView('덱이 가득 찼어요. 먼저 하나를 빼세요');return}
    save();deckView();
  });
}
$('gb').onclick=()=>gachaView([]);
$('db').onclick=()=>deckView();
coinTxt();
if(!SV.name)nickView(true);
$('bestl').textContent='최고 '+best+'웨이브';
try{if(document.fonts&&document.fonts.load){document.fonts.load("16px Jua","요리 디펜스 가나다").then(f=>{if(f&&f.length){document.documentElement.classList.add('jua');BG=mkBG()}}).catch(()=>{})}}catch(e){}
requestAnimationFrame(loop);
</script>
